<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087dff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="メッセージ直行"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>メッセージ直行</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eff8ff,#fff);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#102a49;min-height:100dvh;display:grid;place-items:center;padding:22px}.card{width:min(100%,420px);background:white;border-radius:28px;box-shadow:0 14px 50px #1a65a522;padding:30px 24px;text-align:center}.logo{width:108px;height:108px;border-radius:24px;object-fit:cover}h1{font-size:24px;margin:16px 0 8px}.sub{color:#667a91;line-height:1.7;font-size:14px}.field{text-align:left;margin:25px 0 15px}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #bdd7ee;border-radius:13px;font-size:18px;background:#f8fcff;color:#102a49}button{width:100%;border:0;background:linear-gradient(135deg,#20b8ff,#0061f5);color:white;border-radius:15px;padding:16px;font-size:17px;font-weight:700;box-shadow:0 5px 12px #007aff35;cursor:pointer}.secondary{margin-top:12px;background:#edf5ff;color:#1760b7;box-shadow:none;font-size:14px}.hint{font-size:12px;color:#7c8a99;line-height:1.7;margin-top:20px}.error{color:#bd2439;font-size:13px;min-height:20px}#ready{display:none}#setup{display:none}</style></head><body><main class="card"><img class="logo" src="icon-192.png" alt="青いメッセージアイコン"><h1>メッセージ直行</h1><section id="setup"><p class="sub">送信先を一度だけ登録してください。<br>電話番号はこの端末内に保存します。</p><div class="field"><label for="phone">相手の電話番号</label><input id="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="09012345678"></div><p class="error" id="error"></p><button id="save">登録してメッセージを開く</button></section><section id="ready"><p class="sub">登録した相手へのメッセージ作成画面を開きます。</p><button id="open">メッセージを開く</button><button class="secondary" id="change">送信先を変更</button></section><p class="hint">メッセージの送信は自動では行いません。iPhoneの「メッセージ」で文章を入力して送信してください。<br>iOSの動作により確認操作が必要な場合があります。</p></main><script>const key='blue-message-recipient-v1';const setup=document.getElementById('setup'),ready=document.getElementById('ready'),phone=document.getElementById('phone'),error=document.getElementById('error');function get(){try{return localStorage.getItem(key)||''}catch{return ''}}function set(v){try{localStorage.setItem(key,v);return true}catch{return false}}function show(){let saved=get();setup.style.display=saved?'none':'block';ready.style.display=saved?'block':'none'}function openSMS(){const value=get();if(!value){show();return}window.location.href='sms:'+encodeURIComponent(value)}document.getElementById('save').onclick=()=>{const v=phone.value.replace(/[\s\-()]/g,'');if(!/^\+?[0-9]{8,15}$/.test(v)){error.textContent='電話番号を数字で入力してください。';return}if(!set(v)){error.textContent='保存できませんでした。ブラウザの設定をご確認ください。';return}error.textContent='';show();openSMS()};document.getElementById('open').onclick=openSMS;document.getElementById('change').onclick=()=>{phone.value=get();try{localStorage.removeItem(key)}catch{}show()};show();if(get()){setTimeout(openSMS,350)}</script></body></html>
